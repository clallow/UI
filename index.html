<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>反馈系统 - Web演示</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      nav {
        background-color: #6366f1;
        color: white;
        padding: 1rem 2rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      .nav-content {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo {
        font-size: 1.5rem;
        font-weight: bold;
      }
      .nav-links {
        display: flex;
        gap: 1.5rem;
      }
      .nav-links a {
        color: white;
        text-decoration: none;
        font-weight: 500;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        transition: background-color 0.2s;
      }
      .nav-links a:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }
      main {
        flex: 1;
        padding: 2rem;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
      }
      .hero {
        text-align: center;
        margin-bottom: 3rem;
      }
      .hero h1 {
        font-size: 2.5rem;
        font-weight: bold;
        color: #1e293b;
        margin-bottom: 1rem;
      }
      .hero p {
        font-size: 1.125rem;
        color: #64748b;
        max-width: 600px;
        margin: 0 auto;
      }
      .card {
        background-color: white;
        border-radius: 0.75rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        padding: 2rem;
        margin-bottom: 2rem;
      }
      .card h2 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 1rem;
      }
      .card p {
        color: #64748b;
        line-height: 1.6;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
      }
      footer {
        background-color: #f1f5f9;
        padding: 2rem;
        text-align: center;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-content">
        <div class="logo">反馈系统</div>
        <div class="nav-links">
          <a href="#">提交反馈</a>
          <a href="#">管理反馈</a>
        </div>
      </div>
    </nav>
    <main>
      <div class="hero">
        <h1>反馈系统演示</h1>
        <p>这是一个现代化的反馈系统，允许用户提交反馈并在管理页面查看所有反馈数据。</p>
      </div>
      <div class="grid">
        <div class="card">
          <h2>反馈提交</h2>
          <p>用户可以填写姓名、邮箱和反馈内容，系统会验证数据并提交到后台。</p>
        </div>
        <div class="card">
          <h2>反馈管理</h2>
          <p>管理员可以在管理页面查看所有反馈，按时间倒序排列，并显示相对时间。</p>
        </div>
        <div class="card">
          <h2>技术栈</h2>
          <p>前端：React Native / Web<br>后端：Node.js + Express<br>数据库：MongoDB</p>
        </div>
      </div>
    </main>
    <footer>
      <p>&copy; 2026 反馈系统 - 演示版本</p>
    </footer>
  </body>
</html>
